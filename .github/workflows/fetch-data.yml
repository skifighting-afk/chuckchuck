# 공식 자료(PDF 등)를 받아 글자로 바꿔 data-import 브랜치에 올린다. 개발 환경에서 직접 받을 수 없는 자료용.
# 예: 근로소득 간이세액표(소득세법 시행령 별표2) PDF → pdftotext → 사람이 확인한 뒤 data/에 반영
name: 공식 자료 가져오기
on:
  workflow_dispatch:
    inputs:
      url:
        description: 받을 파일 주소(PDF)
        required: true
      name:
        description: 저장 이름(영문)
        required: true
      type:
        description: 파일 형식(pdf 또는 hwp)
        required: false
        default: pdf
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 받기·변환
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
          TYPE: ${{ inputs.type || 'pdf' }}
        run: |
          set -euo pipefail
          case "$NAME" in *[!a-z0-9-]*) echo "이름은 영문 소문자·숫자·-만"; exit 1;; esac
          case "$TYPE" in pdf|hwp) ;; *) echo "형식은 pdf 또는 hwp"; exit 1;; esac
          mkdir -p /tmp/out
          curl -sSfL --max-filesize 30000000 -o /tmp/out/$NAME.$TYPE "$URL"
          sha256sum /tmp/out/$NAME.$TYPE > /tmp/out/$NAME.sha256
          echo "$URL" > /tmp/out/$NAME.source
          if [ "$TYPE" = pdf ]; then sudo apt-get install -y poppler-utils >/dev/null; pdftotext -layout /tmp/out/$NAME.pdf /tmp/out/$NAME.txt
          else pip install --quiet pyhwp six lxml >/dev/null 2>&1; hwp5html --output /tmp/html /tmp/out/$NAME.hwp
            python3 -c "import html.parser,sys,re;t=[];P=type('P',(html.parser.HTMLParser,),{'handle_data':lambda s,d:t.append(d),'handle_starttag':lambda s,g,a:t.append('\n' if g in('p','tr','br') else (' | ' if g=='td' else ''))});P().feed(open('/tmp/html/index.xhtml',encoding='utf-8').read());print(re.sub(r'\n\s*\n+','\n',''.join(t)))" > /tmp/out/$NAME.txt; fi
          wc -l /tmp/out/$NAME.txt
      - name: data-import 브랜치에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data-import || true
          if git rev-parse --verify -q origin/data-import >/dev/null; then git worktree add /tmp/wt origin/data-import && (cd /tmp/wt && git switch -c data-import); else git worktree add --detach /tmp/wt && (cd /tmp/wt && git switch --orphan data-import); fi
          cp /tmp/out/* /tmp/wt/ && cd /tmp/wt && git add -A && git commit -m "자료 가져오기: ${{ inputs.name }}" && git push origin data-import
