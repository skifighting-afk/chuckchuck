# 작업 003: develop 브랜치 → 스테이징(두 번째 Supabase 프로젝트). 운영 DB에는 절대 닿지 않게 한다.
# 준비물(사장님): Supabase 프로젝트 하나 더 만들기 →
#   저장소 Secrets: STAGING_SUPABASE_PROJECT_REF, STAGING_SUPABASE_DB_PASSWORD (SUPABASE_ACCESS_TOKEN은 운영과 같은 계정이면 그대로 사용)
#   저장소 Variables: STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY
# 비밀값이 없으면 테스트만 하고 배포는 건너뛴다. 화면은 스테이징 주소로 빌드해 내려받을 수 있는 파일(artifact)로 남긴다.
name: 스테이징
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: staging, cancel-in-progress: true}
jobs:
  staging:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: chuck_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/chuck_test
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
      APP_DOMAIN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund >/dev/null
      - name: 검사·테스트
        run: |
          set -o pipefail
          npm run check && npm run build && npm test
      - name: 스테이징 설정 확인(운영과 같은 프로젝트면 중단)
        id: cfg
        run: |
          if [ -z "$STAGING_REF" ] || [ -z "$STAGING_DB_PASSWORD" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "deploy=no" >> "$GITHUB_OUTPUT"; echo "스테이징 비밀값·변수가 없어 배포를 건너뜀(준비물: 두 번째 Supabase 프로젝트)"; exit 0; fi
          if [ "$STAGING_REF" = "$PROD_REF" ] || echo "$SUPABASE_URL" | grep -q "$PROD_REF"; then
            echo "::error::스테이징 설정이 운영 프로젝트를 가리켜요. 배포를 멈춥니다."; exit 1; fi
          echo "deploy=yes" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.deploy == 'yes'
        with: {version: latest}
      - name: 스테이징 DB·서버 함수
        if: steps.cfg.outputs.deploy == 'yes'
        run: |
          set -o pipefail
          supabase link --project-ref "$STAGING_REF" -p "$STAGING_DB_PASSWORD"
          supabase db push -p "$STAGING_DB_PASSWORD" --include-all
          supabase functions deploy api --project-ref "$STAGING_REF" --no-verify-jwt --use-api
      - name: 스테이징 서버 확인
        if: steps.cfg.outputs.deploy == 'yes'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/functions/v1/api/auth")
          echo "GET /api/auth → $code"; [ "$code" = "200" ]
      - name: 스테이징용 화면 파일
        if: steps.cfg.outputs.deploy == 'yes'
        uses: actions/upload-artifact@v4
        with: {name: staging-client, path: dist/client, retention-days: 7}
