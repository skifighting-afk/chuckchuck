# 작업 075: npm audit — 운영 의존성에 high 이상 취약점이 있으면 실패. 매주 월요일과 의존성 변경 시.
name: 취약점 점검
on:
  schedule: [{cron: '0 0 * * 1'}]
  push:
    paths: [package.json, package-lock.json]
  pull_request:
    paths: [package.json, package-lock.json]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: 운영 의존성 (high 이상이면 실패)
        run: npm audit --omit=dev --audit-level=high
      - name: 전체 의존성 (참고용)
        run: npm audit || true
