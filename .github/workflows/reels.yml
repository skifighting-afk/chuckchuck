name: 인스타 릴스 자동 올리기

# 매일 저녁 6시(한국 시간)에 노무 상식·사용법 주제 하나로 릴스를 만들어 올린다.
# 인스타 연결 정보(IG_USER_ID, IG_ACCESS_TOKEN)가 없으면 영상만 만들어 실행 결과 파일로 남긴다.
on:
  schedule:
    - cron: '52 8 * * *'
  workflow_dispatch:
    inputs:
      index:
        description: '주제 번호 (비우면 오늘 차례)'
        required: false
        default: ''
      post:
        description: '인스타에 올리기'
        type: boolean
        default: true

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 도구 준비 (한글 글꼴 · ffmpeg · 화면 찍기)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: 릴스 만들기
        run: |
          if [ -n "${{ github.event.inputs.index }}" ]; then node scripts/reels/make.mjs --index "${{ github.event.inputs.index }}" --out reel-out; else node scripts/reels/make.mjs --out reel-out; fi
      - name: 만든 영상 보관
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel-out/
          retention-days: 14
      - name: 인스타에 올리기
        if: github.event_name == 'schedule' || github.event.inputs.post == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HOST: ${{ secrets.IG_HOST }}
        run: node scripts/reels/post.mjs reel-out
