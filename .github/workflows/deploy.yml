# main에 올리면: 검사 → Supabase DB → 서버 함수 → 응답 확인 → GitHub Pages 화면 배포.
# 결과는 ci-status 브랜치에 기록된다(비공개 저장소에서도 Claude가 git으로 확인할 수 있게).
name: 빌드·배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  APP_DOMAIN: ${{ vars.APP_DOMAIN }}

jobs:
  test:
    name: 검사·빌드
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chuck_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/chuck_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p ci-logs
      - name: 의존성 설치
        id: install
        run: |
          set -o pipefail
          # 작업 008: 잠금 파일 그대로 설치(package.json과 다르면 실패 → 로컬에서 npm install 후 lock 커밋)
          npm ci --no-audit --no-fund 2>&1 | tee ci-logs/1-install.log
      - name: 타입 검사
        id: typecheck
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ci-logs/2-typecheck.log
      - name: 빌드
        id: build
        if: always() && steps.install.outcome == 'success'
        env:
          REQUIRE_SUPABASE_CONFIG: ${{ github.event_name == 'push' && '1' || '' }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-logs/3-build.log
      - name: 테스트
        id: tests
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          { npm test && npm run check:function; } 2>&1 | tee ci-logs/4-test.log
      - name: 급여·계약 모듈 커버리지 90% 이상 (작업 088)
        if: steps.tests.outcome == 'success'
        run: |
          set -o pipefail
          node scripts/coverage.mjs --min 90 2>&1 | tee ci-logs/5-coverage.log
      - name: 배포 파일 보관
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: function
          path: supabase/functions/api/index.js
      - name: 화면 파일 보관
        if: steps.build.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
      - name: 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-test
          path: ci-logs

  e2e:
    name: 화면 E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chuck_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/chuck_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p ci-logs
      - name: 의존성 설치
        run: |
          npm ci --no-audit --no-fund >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: 사장님·직원 핵심 흐름 (작업 080·052)
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee ci-logs/15-e2e.log
      - name: 390px 모든 화면 가로 넘침 검사·이전 실행과 비교 (작업 089)
        run: |
          set -o pipefail
          mkdir -p /tmp/base
          git fetch -q --depth=1 origin ci-status && git archive origin/ci-status mobile 2>/dev/null | tar -x -C /tmp/base 2>/dev/null || true
          E2E_WWW=dist/client MOBILE_OUT=ci-logs/mobile MOBILE_BASELINE=/tmp/base/mobile node scripts/mobile-check.mjs 2>&1 | tee ci-logs/16-mobile.log
      - name: 실패 화면 보관
        if: failure()
        run: cp e2e-failure-*.png ci-logs/ 2>/dev/null || true
      - name: 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e2e
          path: ci-logs

  deploy:
    name: 배포
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-logs
      # 늦게 시작한 옛 실행이 최신 배포를 덮어쓰지 않게, main의 최신 커밋일 때만 배포한다.
      - name: 최신 커밋 확인
        id: fresh
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "ok=yes" >> "$GITHUB_OUTPUT"; echo "최신 커밋: 배포 진행" | tee ci-logs/5-fresh.log
          else echo "ok=no" >> "$GITHUB_OUTPUT"; echo "이 커밋($GITHUB_SHA)은 최신이 아님(main=$head): 배포 건너뜀" | tee ci-logs/5-fresh.log; fi
      - name: 설정 확인
        id: cfg
        if: steps.fresh.outputs.ok == 'yes'
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "supabase=yes" >> "$GITHUB_OUTPUT"; echo "Supabase도 여기서 배포" | tee ci-logs/5-config.log
          else
            echo "supabase=no" >> "$GITHUB_OUTPUT"; echo "Supabase 비밀값 없음: 배포 중단" | tee ci-logs/5-config.log
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: function
          path: supabase/functions/api
      - name: 화면 주소 정리
        id: origin
        if: steps.fresh.outputs.ok == 'yes'
        run: |
          page="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          APP_DOMAIN="${APP_DOMAIN:-$(node -p "require('./deploy.config.json').APP_DOMAIN||''")}"
          origins="$(echo "$page" | sed -E 's#^(https?://[^/]+).*#\1#')"
          if [ -n "$APP_DOMAIN" ]; then origins="https://$APP_DOMAIN,$origins"; fi
          echo "origins=$origins" >> "$GITHUB_OUTPUT"
          echo "primary=${origins%%,*}" >> "$GITHUB_OUTPUT"
          echo "화면 주소: $origins" | tee ci-logs/6-pages.log
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.supabase == 'yes'
        with:
          version: latest
      - name: Supabase 연결
        if: steps.cfg.outputs.supabase == 'yes'
        run: |
          set -o pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" 2>&1 | tee ci-logs/7-link.log
      - name: DB 마이그레이션
        id: database
        if: steps.cfg.outputs.supabase == 'yes'
        run: |
          set -o pipefail
          supabase db push -p "$SUPABASE_DB_PASSWORD" --include-all 2>&1 | tee ci-logs/8-db.log
      - name: 로그인 설정 반영
        if: steps.cfg.outputs.supabase == 'yes'
        continue-on-error: true
        env:
          APP_ORIGIN_PRIMARY: ${{ steps.origin.outputs.primary }}
          APP_ORIGIN_EXTRA: ${{ steps.origin.outputs.origins }}
        run: |
          set -o pipefail
          yes | supabase config push --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee ci-logs/9-auth-config.log
      - name: 웹 푸시 키 준비(작업 092)
        if: steps.cfg.outputs.supabase == 'yes'
        env:
          VAPID_SEED: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/vapid-derive.mjs
      - name: 매일 작업 비밀값 준비(가이드 57)
        if: steps.cfg.outputs.supabase == 'yes'
        env:
          CRON_SEED: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/cron-secret.mjs
      - name: 서버 함수 비밀값 설정
        if: steps.cfg.outputs.supabase == 'yes'
        env:
          HQ_ADMIN_EMAIL: ${{ secrets.HQ_ADMIN_EMAIL }}
          HQ_NATIVE_USER_ID: ${{ secrets.HQ_NATIVE_USER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          NTS_API_KEY: ${{ secrets.NTS_API_KEY }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_PFID: ${{ secrets.SOLAPI_PFID }}
          SOLAPI_SENDER: ${{ secrets.SOLAPI_SENDER }}
          ALIMTALK_TEMPLATES: ${{ secrets.ALIMTALK_TEMPLATES }}
          KAKAO_SKILL_KEY: ${{ secrets.KAKAO_SKILL_KEY }}
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
        run: |
          set -o pipefail
          args=("APP_ORIGIN=${{ steps.origin.outputs.origins }}")
          for v in HQ_ADMIN_EMAIL HQ_NATIVE_USER_ID RESEND_API_KEY EMAIL_FROM VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT NTS_API_KEY CRON_SECRET SOLAPI_API_KEY SOLAPI_API_SECRET SOLAPI_PFID SOLAPI_SENDER ALIMTALK_TEMPLATES KAKAO_SKILL_KEY TOSS_CLIENT_KEY TOSS_SECRET_KEY FCM_SERVICE_ACCOUNT APNS_KEY APNS_KEY_ID APNS_TEAM_ID; do
            [ -n "${!v}" ] && args+=("$v=${!v}")
          done
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}" 2>&1 | sed -E 's/=.*/=***/' | tee ci-logs/10-secrets.log
      - name: 서버 함수 배포
        id: function
        if: steps.cfg.outputs.supabase == 'yes'
        run: |
          set -o pipefail
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api 2>&1 | tee ci-logs/11-function.log
      - name: 배포 확인
        id: health
        if: steps.fresh.outputs.ok == 'yes' && steps.cfg.outputs.supabase == 'yes'
        run: |
          SUPABASE_URL="${SUPABASE_URL:-$(node -p "require('./deploy.config.json').SUPABASE_URL")}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$(node -p "require('./deploy.config.json').SUPABASE_ANON_KEY")}"
          if [ -z "$SUPABASE_URL" ]; then echo "Supabase 주소 없음: 배포 중단" | tee ci-logs/12-health.log; exit 1; fi
          set -o pipefail
          code=$(curl -s -o ci-logs/12-health.json -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" -H "Origin: ${{ steps.origin.outputs.primary }}" "$SUPABASE_URL/functions/v1/api/auth")
          echo "GET /api/auth → $code" | tee -a ci-logs/12-health.log
          cat ci-logs/12-health.json | tee -a ci-logs/12-health.log
          [ "$code" = "200" ]
      - name: 화면 배포 (GitHub Pages)
        id: pages
        if: steps.fresh.outputs.ok == 'yes' && steps.health.outcome == 'success'
        uses: actions/deploy-pages@v4
      # 작업 004: 실제 주소에서 가입 → 가게 만들기 → 로그아웃 → 다시 로그인. 점검 계정은 끝나고 지운다.
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.ok == 'yes' && steps.cfg.outputs.supabase == 'yes'
        with:
          node-version: 22
      - name: 배포 후 실제 점검
        if: steps.fresh.outputs.ok == 'yes' && steps.cfg.outputs.supabase == 'yes'
        env:
          SMOKE_URL: ${{ steps.origin.outputs.primary }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.56.0 axe-core@4 >/dev/null
          ln -sfn /tmp/pw/node_modules node_modules
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          node scripts/smoke-prod.mjs 2>&1 | tee ci-logs/13-smoke.log
      - name: 접근성 점검 (axe + 48px·12px·대비 기준)
        if: steps.fresh.outputs.ok == 'yes' && steps.cfg.outputs.supabase == 'yes'
        env:
          SMOKE_URL: ${{ steps.origin.outputs.primary }}
        run: |
          set -o pipefail
          node scripts/a11y-check.mjs 2>&1 | tee ci-logs/14-a11y.log
      - name: 점검 실패 화면 보관
        if: failure()
        run: cp smoke-failure.png ci-logs/13-smoke-failure.png 2>/dev/null || true
      - name: 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-deploy
          path: ci-logs

  report:
    name: 결과 기록
    needs: [test, e2e, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs
          merge-multiple: true
        continue-on-error: true
      - name: ci-status 브랜치에 기록
        run: |
          mkdir -p /tmp/status && cp -r logs/. /tmp/status/ 2>/dev/null || true
          cat > /tmp/status/status.json <<EOF
          {"sha":"${{ github.sha }}","ref":"${{ github.ref }}","event":"${{ github.event_name }}","run":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","test":"${{ needs.test.result }}","e2e":"${{ needs.e2e.result }}","deploy":"${{ needs.deploy.result }}","at":"$(date -u +%FT%TZ)"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-status || true
          if git rev-parse --verify -q origin/ci-status >/dev/null; then git worktree add /tmp/wt origin/ci-status && (cd /tmp/wt && git switch -c ci-status); else git worktree add --detach /tmp/wt && (cd /tmp/wt && git switch --orphan ci-status); fi
          cd /tmp/wt && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + && cp -r /tmp/status/. . && git add -A && git commit -m "CI ${{ github.sha }} test=${{ needs.test.result }} e2e=${{ needs.e2e.result }} deploy=${{ needs.deploy.result }}" && git push origin ci-status
